/* 🔥 ELEMENTS                                      */
/* ================================================= */

const container =
document.getElementById("cityContainer");

const lightbox =
document.getElementById("lightbox");

const lightboxImg =
document.getElementById("lightboxImg");

const searchInput =
document.getElementById("searchInput");


/* ================================================= */
/* ❤️ FAVORITES                                     */
/* ================================================= */

let favorites =
JSON.parse(
    localStorage.getItem("favorites")
) || [];


/* ================================================= */
/* 📌 CURRENT CITY LIST                              */
/* ================================================= */

let currentCities = cities;

let currentIndex = 0;


/* ================================================= */
/* ============== DISPLAY CITIES =================== */
/* ================================================= */

function displayCities(list) {

    currentCities = list;

    container.innerHTML = "";

    list.forEach((city, index) => {

        container.innerHTML += `

        <div class="card">

            <img
                src="${city.image}"
                loading="lazy"
                alt="${city.name}"
                data-index="${index}"
            >

            <div class="card-content">

                <h3>${city.name}</h3>

                <p>${city.country}</p>

                <button
                    type="button"
                    class="card-download"
                    data-image="${city.image}"
                    data-city="${city.name}"
                >
                    📥 Download
                </button>

            </div>

        </div>

        `;

    });


    container
    .querySelectorAll(".card img")
    .forEach(img => {

        img.addEventListener("dblclick", () => {

            openLightbox(
                Number(img.dataset.index)
            );

        });


        let timer;

        img.addEventListener("touchstart", () => {

            timer = setTimeout(() => {

                openLightbox(
                    Number(img.dataset.index)
                );

            }, 500);

        });


        img.addEventListener("touchend", () => {

            clearTimeout(timer);

        });

    });


    container
    .querySelectorAll(".card-download")
    .forEach(button => {

        button.addEventListener("click", () => {

            downloadImage(
                button.dataset.image,
                button.dataset.city
            );

        });

    });

}


/* ================================================= */
/* ================= SEARCH ======================== */
/* ================================================= */

function searchCity(value) {

    let q =
        value
        .toLowerCase()
        .trim();

    let filtered =
        cities.filter(city => {

            return (

                city.name
                .toLowerCase()
                .includes(q)

                ||

                city.country
                .toLowerCase()
                .includes(q)

            );

        });

    displayCities(filtered);

}


/* ================================================= */
/* ================= LIGHTBOX ====================== */
/* ================================================= */

function openLightbox(index) {

    if (!currentCities.length) return;

    currentIndex = index;

    lightbox.style.display = "flex";

    lightboxImg.src =
        currentCities[currentIndex].image;

    setTimeout(() => {

        lightbox.classList.add("show");

    }, 10);

    playSound("open");

    loadMap(
        currentCities[currentIndex].name
    );

}


/* ❌ CLOSE */

function closeLightbox() {

    lightbox.classList.remove("show");

    setTimeout(() => {

        lightbox.style.display = "none";

    }, 200);

    playSound("close");

}


/* 👉 NEXT IMAGE */

function nextImage() {

    if (!currentCities.length) return;

    currentIndex++;

    if (
        currentIndex >= currentCities.length
    ) {

        currentIndex = 0;

    }

    updateImage();

}


/* 👈 PREVIOUS IMAGE */

function prevImage() {

    if (!currentCities.length) return;

    currentIndex--;

    if (currentIndex < 0) {

        currentIndex =
            currentCities.length - 1;

    }

    updateImage();

}


/* 🔄 UPDATE */

function updateImage() {

    lightboxImg.src =
        currentCities[currentIndex].image;

    loadMap(
        currentCities[currentIndex].name
    );

}


/* ================================================= */
/* ================= KEYBOARD ====================== */
/* ================================================= */

document.addEventListener("keydown", e => {

    if (e.key === "Escape") {

        closeLightbox();

    }

    if (e.key === "ArrowRight") {

        nextImage();

    }

    if (e.key === "ArrowLeft") {

        prevImage();

    }

});


/* ================================================= */
/* ================= MOBILE SWIPE ================== */
/* ================================================= */

let startX = 0;

lightbox.addEventListener(
    "touchstart",
    e => {

        startX =
            e.touches[0].clientX;

    }
);


lightbox.addEventListener(
    "touchend",
    e => {

        let endX =
            e.changedTouches[0].clientX;

        if (startX - endX > 50) {

            nextImage();

        }

        if (endX - startX > 50) {

            prevImage();

        }

    }
);


/* ================================================= */
/* ================= FAVORITES ===================== */
/* ================================================= */

function toggleFavorite(event) {

    if (event) {

        event.stopPropagation();

    }

    if (!currentCities.length) return;

    let img =
        currentCities[currentIndex].image;

    if (favorites.includes(img)) {

        favorites =
            favorites.filter(
                i => i !== img
            );

        alert("Removed from favorites");

    } else {

        favorites.push(img);

        alert("Added to favorites ❤️");

    }

    localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
    );

}


/* ================================================= */
/* ================= DOWNLOAD ====================== */
/* ================================================= */

function downloadImage(imageUrl, cityName) {

    const link =
        document.createElement("a");

    link.href = imageUrl;

    link.download =
        cityName + ".jpg";

    link.target = "_blank";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

}

    let map =

    map.src =
        `https://www.google.com/maps?q=${encodeURIComponent(cityName)}&output=embed`;

}

            famous:

        },


        london: {

            famous:

        },


        tokyo: {

            description:

        },


        cairo: {

        },


        nairobi: {

        },


        kampala: {

            capital: true,

            "Kampala is the capital city of Uganda 🇺🇬",

            "Central Uganda",

            famous:
            "One of the major cities of East Africa."

        },


        dubai: {

            city: "Dubai",

            country: "United Arab Emirates",

            capital: false,

            description:
            "Dubai is a major city in the United Arab Emirates 🇦🇪",

            "Persian Gulf",

            "Northeastern United States",

        }

    };


    let foundCity = null;

        ) {

        }

        else if (

        ) {

            reply =
                foundCity.capital

                :

        }

        else if (
            lower.includes("famous") ||
            lower.includes("tourist") ||
            lower.includes("visit")
        ) {

            reply =
                `📸 ${foundCity.city}: ${foundCity.famous}`;

        }

        else {

            reply =
                `${foundCity.description}

📍 Location: ${foundCity.location}

🌍 Country: ${foundCity.country}

🏛️ Capital: ${
                    foundCity.capital
                    ? "Yes"
                    : "No"
                }

⭐ ${foundCity.famous}`;

        }

    }


    else if (
        lower.includes("cities") ||
        lower.includes("city")
    ) {

        reply =
            "🌍 I can help you explore cities around the world. Try asking: Where is Kigali? Is Paris a capital? What is London famous for?";

    }


    else if (
        lower.includes("capital cities") ||
        lower.includes("capitals")
    ) {

        reply =
            "🏛️ I can help you explore capital cities such as Kigali, Paris, London, Tokyo, Cairo, Nairobi, Kampala and many more.";

    }


    else if (
        lower.includes("hello") ||
        lower.includes("hi")
    ) {

        reply =
            "👋 Hello! Welcome to World Cities Gallery 🌍. Ask me about any city.";

    }


    messages.innerHTML += `

        <div class="user-message">

            <b>👤 You:</b>

            ${escapeAIText(input)}

        </div>

        <div class="ai-message">

            <b>🤖 AI:</b>

            ${escapeAIText(reply)}

        </div>

    `;


    document.getElementById(
        "userInput"
    ).value = "";


    messages.scrollTop =
        messages.scrollHeight;

}


/* ==========================================
   🔐 PROTECT USER INPUT
   ========================================== */

function escapeAIText(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* ================================================= */
/* ================= SPEECH ======================== */
/* ================================================= */

function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "Speech recognition is not supported by this browser."
        );

        return;

    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.onresult =
    function(event) {

        let text =
            event.results[0][0].transcript;

        document.getElementById(
            "userInput"
        ).value = text;

        askAI();

    };


    recognition.start();

}


/* ================================================= */
/* ================= SOUND FX ====================== */
/* ================================================= */

function playSound(type) {

    let audio =
        new Audio(

            type === "open"

            ?

            "https://www.soundjay.com/buttons/sounds/button-09.mp3"

            :

            "https://www.soundjay.com/buttons/sounds/button-10.mp3"

        );

    audio
        .play()
        .catch(() => {});

}


/* ================================================= */
/* ================= IMAGE UPLOAD ================== */
/* ================================================= */

function uploadImage() {

    const file =
        document.getElementById(
            "uploadInput"
        ).files[0];


    if (!file) {

        alert(
            "Please select an image first."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
    function(e) {

        const img =
            document.createElement("img");


        img.src =
            e.target.result;


        img.alt =
            "Uploaded image";


        document
            .getElementById("userGallery")
            .appendChild(img);


        saveImage(
            e.target.result
        );

    };


    reader.readAsDataURL(file);

}


/* 💾 SAVE */

function saveImage(src) {

    let images =
        JSON.parse(
            localStorage.getItem("userImages")
        ) || [];


    images.push(src);


    localStorage.setItem(
        "userImages",
        JSON.stringify(images)
    );

}


/* 🔄 LOAD SAVED */

function loadSavedImages() {

    let images =
        JSON.parse(
            localStorage.getItem("userImages")
        ) || [];


    images.forEach(src => {

        const img =
            document.createElement("img");


        img.src =
            src;


        img.alt =
            "Saved image";


        document
            .getElementById("userGallery")
            .appendChild(img);

    });

}


/* ================================================= */
/* ================= LIKE SYSTEM =================== */
/* ================================================= */

function likePost(btn) {

    let count =
        btn.querySelector("span");


    count.innerText =
        parseInt(
            count.innerText || "0"
        ) + 1;

}


/* ================================================= */
/* ================= COMMENTS ====================== */
/* ================================================= */

function addComment(btn) {

    const parent =
        btn.parentElement;


    const input =
        parent.querySelector(
            ".commentInput"
        );


    const list =
        parent.querySelector(
            ".commentList"
        );


    if (
        input.value.trim() === ""
    ) return;


    const p =
        document.createElement("p");


    p.innerText =
        input.value;


    list.appendChild(p);


    input.value = "";

}


/* ================================================= */
/* ================= LOGIN ========================= */
/* ================================================= */

function login() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();


    if (!username) {

        alert(
            "Please enter username."
        );

        return;

    }


    localStorage.setItem(
        "user",
        username
    );


    alert(
        "Welcome " + username
    );

}


/* ================================================= */
/* ================= CAMERA ======================== */
/* ================================================= */

function startCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        console.log(
            "Camera is not supported."
        );

        return;

    }


    navigator.mediaDevices
    .getUserMedia({
        video: true
    })

    .then(stream => {

        document
            .getElementById("camera")
            .srcObject = stream;

    })

    .catch(error => {

        console.log(
            "Camera permission:",
            error
        );

    });

}


/* 📸 TAKE PHOTO */

function takePhoto() {

    const video =
        document.getElementById("camera");


    const canvas =
        document.getElementById("canvas");


    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        alert(
            "Camera is not ready yet."
        );

        return;

    }


    const ctx =
        canvas.getContext("2d");


    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    ctx.drawImage(
        video,
        0,
        0
    );

}


/* ================================================= */
/* 🎥 VIDEO SYSTEM                                  */
/* ================================================= */

let videos =
    JSON.parse(
        localStorage.getItem("worldCitiesVideos")
    ) || [];


const videoUpload =
document.getElementById("videoUpload");

const videoUploadBtn =
document.getElementById("videoUploadBtn");

const videoGallery =
document.getElementById("videoGallery");

const videoSearch =
document.getElementById("videoSearch");

const videoPlayerBox =
document.getElementById("videoPlayerBox");

const mainVideoPlayer =
document.getElementById("mainVideoPlayer");

const currentVideoTitle =
document.getElementById("currentVideoTitle");

const closeVideoBtn =
document.getElementById("closeVideoBtn");


/* ================================================= */
/* 🎥 SAVE VIDEOS                                   */
/* ================================================= */

function saveVideos() {

    try {

        localStorage.setItem(
            "worldCitiesVideos",
            JSON.stringify(videos)
        );

    }

    catch (error) {

        console.log(
            "Video storage error:",
            error
        );

        alert(
            "This video is too large for browser storage. Try a smaller video."
        );

    }

}


/* ================================================= */
/* 📤 UPLOAD VIDEO                                  */
/* ================================================= */

function uploadVideo() {

    const file =
        videoUpload.files[0];


    if (!file) {

        alert(
            "Please select a video first."
        );

        return;

    }


    if (!file.type.startsWith("video/")) {

        alert(
            "Please select a valid video file."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
    function(event) {

        const videoData = {

            id:
                Date.now(),

            name:
                file.name,

            type:
                file.type,

            size:
                file.size,

            data:
                event.target.result,

            date:
                new Date().toLocaleString()

        };


        videos.push(
            videoData
        );


        saveVideos();


        displayVideos();


        videoUpload.value = "";


        alert(
            "🎥 Video uploaded successfully!"
        );

    };


    reader.readAsDataURL(file);

}


/* ================================================= */
/* 🎥 DISPLAY VIDEOS                                */
/* ================================================= */

function displayVideos(list = videos) {

    videoGallery.innerHTML = "";


    if (!list.length) {

        videoGallery.innerHTML = `

            <div class="no-videos">

                <h3>🎥 No videos yet</h3>

                <p>
                    Upload a video to start your
                    World Cities Video Gallery.
                </p>

            </div>

        `;

        return;

    }


    list.forEach(video => {

        const card =
            document.createElement("div");


        card.className =
            "video-card";


        card.innerHTML = `

            <div class="video-thumbnail">

                <video
                    src="${video.data}"
                    preload="metadata"
                    muted
                >
                </video>

            </div>


            <div class="video-card-content">

                <h3>
                    🎬 ${escapeAIText(video.name)}
                </h3>

                <p>
                    📅 ${escapeAIText(video.date)}
                </p>


                <div class="video-buttons">

                    <button
                        type="button"
                        class="watch-video-btn"
                    >
                        ▶️ Watch Video
                    </button>


                    <button
                        type="button"
                        class="delete-video-btn"
                    >
                        🗑️ Delete
                    </button>

                </div>

            </div>

        `;


        const watchButton =
            card.querySelector(
                ".watch-video-btn"
            );


        const deleteButton =
            card.querySelector(
                ".delete-video-btn"
            );


        watchButton.addEventListener(
            "click",
            () => {

                playVideo(
                    video
                );

            }
        );


        deleteButton.addEventListener(
            "click",
            () => {

                deleteVideo(
                    video.id
                );

            }
        );


        videoGallery.appendChild(
            card
        );

    });

}


/* ================================================= */
/* ▶️ PLAY VIDEO                                    */
/* ================================================= */

function playVideo(video) {

    currentVideoTitle.textContent =
        "🎬 " + video.name;


    mainVideoPlayer.src =
        video.data;


    videoPlayerBox.style.display =
        "block";


    videoPlayerBox.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });


    mainVideoPlayer
        .play()
        .catch(() => {});

}


/* ================================================= */
/* ❌ CLOSE VIDEO                                    */
/* ================================================= */

function closeVideoPlayer() {

    mainVideoPlayer.pause();

    mainVideoPlayer.removeAttribute(
        "src"
    );

    mainVideoPlayer.load();


    videoPlayerBox.style.display =
        "none";

}


/* ================================================= */
/* 🗑️ DELETE VIDEO                                  */
/* ================================================= */

function deleteVideo(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this video?"
        );


    if (!confirmDelete) {

        return;

    }


    videos =
        videos.filter(
            video =>
                video.id !== id
        );


    saveVideos();


    displayVideos();


    closeVideoPlayer();

}


/* ================================================= */
/* 🔍 SEARCH VIDEO                                  */
/* ================================================= */

function searchVideos(value) {

    const query =
        value
        .toLowerCase()
        .trim();


    const filtered =
        videos.filter(video => {

            return video.name
                .toLowerCase()
                .includes(query);

        });


    displayVideos(
        filtered
    );

}


/* ================================================= */
/* 🎥 VIDEO EVENTS                                  */
/* ================================================= */

videoUploadBtn.addEventListener(
    "click",
    uploadVideo
);


closeVideoBtn.addEventListener(
    "click",
    closeVideoPlayer
);


videoSearch.addEventListener(
    "input",
    function(event) {

        searchVideos(
            event.target.value
        );

    }
);
